# Render Blueprint for the first private Pali Scheduler beta.
#
# This file declares Render resources only. A custom domain, Cloudflare Access,
# and disabling the generated onrender.com hostname remain manual launch gates.
# Keep DEMO_ENTRY_ENABLED=false until those gates and hosted validation pass.

services:
  - type: web
    name: pali-sched-beta-web
    runtime: python
    region: ohio
    plan: starter
    autoDeployTrigger: "off"
    buildCommand: >-
      pip install -r requirements.txt &&
      python scheduler_project/manage.py collectstatic --noinput
    preDeployCommand: >-
      python scheduler_project/manage.py migrate --noinput &&
      python scheduler_project/manage.py check_hosted_release
    startCommand: >-
      gunicorn
      --chdir scheduler_project
      scheduler_project.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --worker-class sync
      --timeout 120
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    healthCheckPath: /health/ready/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: scheduler_project.settings_hosted
      - key: DJANGO_DATABASE_ENGINE
        value: django.db.backends.postgresql
      - key: POSTGRES_DB
        fromDatabase:
          name: pali-sched-beta-db
          property: database
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        fromDatabase:
          name: pali-sched-beta-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: pali-sched-beta-db
          property: password
      - key: POSTGRES_SSLMODE
        value: require
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE
        value: "1048576"
      - key: DEMO_ENTRY_ENABLED
        value: "false"
      - key: DEMO_SCAFFOLDING_ENABLED
        value: "true"
      - key: DEMO_ORGANIZATION_IDENTIFIER
        sync: false
      - key: DEMO_MAX_ACTIVE_SESSIONS
        value: "10"
      - key: DEMO_MAX_ACTIVE_PREPARED_SESSIONS
        value: "4"
      - key: DEMO_MAX_ACTIVE_CLEAN_SESSIONS
        value: "6"
      - key: DEMO_GLOBAL_START_LIMIT
        value: "12"
      - key: DEMO_GLOBAL_START_WINDOW_SECONDS
        value: "3600"
      - key: DEMO_CLIENT_START_LIMIT
        value: "3"
      - key: DEMO_CLIENT_START_WINDOW_SECONDS
        value: "900"
      - key: DEMO_MAX_CONCURRENT_PREPARED_OPERATIONS
        value: "1"
      - key: DEMO_PREPARED_RESET_LIMIT
        value: "6"
      - key: DEMO_PREPARED_RESET_WINDOW_SECONDS
        value: "3600"
      - key: DEMO_CAPACITY_RESERVATION_SECONDS
        value: "600"
      - key: DEMO_PREPARED_OPERATION_LEASE_SECONDS
        value: "600"
      - key: DEMO_ATTEMPT_RETENTION_DAYS
        value: "7"
      - key: DEMO_MAINTENANCE_LEASE_SECONDS
        value: "900"
      - key: DEMO_MAINTENANCE_CLEANUP_LIMIT
        value: "25"
      - key: DEMO_MAINTENANCE_ATTEMPT_LIMIT
        value: "500"
      - key: DEMO_MAINTENANCE_AUXILIARY_LIMIT
        value: "100"

  - type: cron
    name: pali-sched-beta-maintenance
    runtime: python
    region: ohio
    plan: starter
    autoDeployTrigger: "off"
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python scheduler_project/manage.py
      run_demo_maintenance --confirm
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: scheduler_project.settings_hosted
      - key: DJANGO_DATABASE_ENGINE
        value: django.db.backends.postgresql
      - key: POSTGRES_DB
        fromDatabase:
          name: pali-sched-beta-db
          property: database
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        fromDatabase:
          name: pali-sched-beta-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: pali-sched-beta-db
          property: password
      - key: POSTGRES_SSLMODE
        value: require
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "true"
      - key: DEMO_ENTRY_ENABLED
        value: "false"
      - key: DEMO_SCAFFOLDING_ENABLED
        value: "true"
      - key: DEMO_ORGANIZATION_IDENTIFIER
        sync: false
      - key: DEMO_MAX_ACTIVE_SESSIONS
        value: "10"
      - key: DEMO_MAX_ACTIVE_PREPARED_SESSIONS
        value: "4"
      - key: DEMO_MAX_ACTIVE_CLEAN_SESSIONS
        value: "6"
      - key: DEMO_GLOBAL_START_LIMIT
        value: "12"
      - key: DEMO_GLOBAL_START_WINDOW_SECONDS
        value: "3600"
      - key: DEMO_CLIENT_START_LIMIT
        value: "3"
      - key: DEMO_CLIENT_START_WINDOW_SECONDS
        value: "900"
      - key: DEMO_MAX_CONCURRENT_PREPARED_OPERATIONS
        value: "1"
      - key: DEMO_PREPARED_RESET_LIMIT
        value: "6"
      - key: DEMO_PREPARED_RESET_WINDOW_SECONDS
        value: "3600"
      - key: DEMO_CAPACITY_RESERVATION_SECONDS
        value: "600"
      - key: DEMO_PREPARED_OPERATION_LEASE_SECONDS
        value: "600"
      - key: DEMO_ATTEMPT_RETENTION_DAYS
        value: "7"
      - key: DEMO_MAINTENANCE_LEASE_SECONDS
        value: "900"
      - key: DEMO_MAINTENANCE_CLEANUP_LIMIT
        value: "25"
      - key: DEMO_MAINTENANCE_ATTEMPT_LIMIT
        value: "500"
      - key: DEMO_MAINTENANCE_AUXILIARY_LIMIT
        value: "100"

databases:
  - name: pali-sched-beta-db
    region: ohio
    plan: basic-256mb
    databaseName: pali_sched_beta
    user: pali_sched_beta
    ipAllowList: []
    storageAutoscalingEnabled: false
